# Скопируйте этот файл в config.yaml и заполните.
#
# mode:
#   dry_run — только читает канал и пишет вам, что БЫ сделал (ордера не отправляются)
#   demo    — торгует, но ТОЛЬКО на демо-счёте (на реальном счёте откажется запускаться)
#   live    — реальный счёт (нужно ещё i_understand_live_trading: true)
mode: dry_run
i_understand_live_trading: false

timezone: Europe/Moscow

telegram:
  api_id: 1234567            # с my.telegram.org → API development tools
  api_hash: "0123456789abcdef0123456789abcdef"
  channel: "Win Win"         # часть названия канала или его числовой ID (см. list_chats.py)
  notify_chat: me            # куда слать отчёты: me = «Избранное» или username (например notheine)
  forward_signals: true      # пересылать оригинал каждого сигнала перед отчётом

mt5:
  login: 59000000            # номер счёта
  password: ""               # пароль от торгового счёта (хранится только на сервере)
  server: "FxPro-MT5 Demo"
  terminal_path: ""          # путь к terminal64.exe; на Linux заполняет установщик
  bridge_host: 127.0.0.1     # только для Linux (мост к MT5 под Wine)
  bridge_port: 18812

magic: 770077                # метка ордеров копировщика (свои ручные сделки он не трогает)

# Лот по таблице куратора: [минимальный баланс $, общий лот на сигнал]
# Общий лот делится поровну на 3 позиции (TP1, TP2, TP3).
lot_table:
  - [200, 0.01]
  - [500, 0.02]
  - [600, 0.03]
  - [700, 0.04]
  - [900, 0.05]
  - [1500, 0.06]
  - [2000, 0.08]
  - [3000, 0.10]
  - [4000, 0.12]
  - [6000, 0.14]
  - [7000, 0.16]
  - [8000, 0.18]
  - [9000, 0.20]
  - [10000, 0.22]
fixed_total_lot: null        # если указать число (например 0.03) — таблица игнорируется
halve_on_risky: true         # сигналы с пометкой RISKY — лот вдвое меньше

# Приоритет правил: 1) команды и данные канала, 2) правила куратора, 3) защита владельца (guard).
risk:
  max_active_signals: 2          # куратор: «не более 2 сигналов одновременно при небольшом депозите»
  max_daily_loss_pct: 0          # 0 = выключено (у куратора дневного лимита нет; на истории он только вредил)
  max_signal_age_sec: 120        # сигнал пришёл позже 2 минут — спрашиваю владельца кнопками (07.10);
                                 # если с публикации цена касалась TP1 или стопа — не входим (куратор)
  ask_risky_buy: true            # покупка с длинным стопом («занижаем риск»/RISKY) — спрашиваю кнопками (07.10)
  late_signal_max_min: 240       # сигнал, пропущенный при перезапуске/сбое и догнанный опросом канала, —
                                 # входим, если ему не больше 4 ч и цена с тех пор не касалась TP1 и стопа
  # Диапазон открытия из сигнала («4158-4155»): входим только внутри него.
  # entry_level — точка входа в диапазоне: 0 = лучший край (BUY — нижний, SELL — верхний), 1 = худший, 0.5 = середина.
  # Цена лучше точки (и в диапазоне) — вход по рынку; хуже — BUY/SELL LIMIT на эту точку.
  # Владелец меняет в группе командой /entry 30 (сохраняется на сервере и важнее этого значения).
  entry_level: 0.5
  # отдельно для покупок и продаж (если не заданы — берётся entry_level); /entry buy 20, /entry sell 80
  # entry_level_buy: 0.5
  # entry_level_sell: 0.5
  # Режим входа. На истории 27.05–02.10 (старт $1000, комиссия $8/лот, свопы; BUY 20% / SELL 80%, rest_limit):
  #   limit  — лимитка на точку входа, по рынку — если цена не хуже точки ........ $1254 (просадка 15.9%)
  #   ladder — лесенка: своя точка у каждой позиции (ladder_levels) ................ $1042…1172
  #   pullback — ждать отката на pullback_usd от лучшей цены (лимитка подтягивается) .. $822…881
  #   curator — как сказал куратор: у диапазона — 3 по рынку, хуже — TP2/TP3 по рынку .. $1015
  #   market — сразу по рынку $965…973; split — TP1 лимиткой, TP2/TP3 по рынку $996…1091
  entry_mode: limit
  after_tp1: rest                # 07.10: по ответу куратора (цена у TP1 → 2 позиции на TP2 и TP3).
                                 # Цена уже прошла TP1, когда пришёл сигнал: skip — пропуск;
                                 # rest — позиции на TP2/TP3 по рынку; rest_limit — то же + позиция TP1 лимиткой на точку входа
  below_range: market            # решение владельца 06.10 (правило куратора). Зеркально: BUY — цена ниже диапазона,
                                 # SELL — выше. Цена за диапазоном в сторону стопа (лучше диапазона): skip — пропуск;
                                 # market — все позиции по рынку (куратор 06.10: «ниже — можно на все три», на истории $1304);
                                 # stop — STOP-ордер на крае диапазона ($1199). Старый ключ out_of_range_stop: true = stop
  above_range: limit             # цена хуже диапазона (дальше curator_near_usd от края): limit — лимитка на точку входа;
                                 # rest — куратор 06.10: 2 позиции на TP2/TP3 по рынку, БУ при TP1 (на истории −$77 к limit)
  curator_near_usd: 1.0          # «около диапазона» для правил куратора: ± $1 от края
  # ladder_levels: [1.0, 0.5, 0.0]   # лесенка: точка для TP1, TP2, TP3 (0 — лучший край, 1 — худший);
                                     # можно отдельно ladder_levels_buy / ladder_levels_sell
  # pullback_usd: 2.0                # режим pullback: откат в $ от лучшей цены после сигнала
  entry_fallback_min: 0          # >0: лимитка не исполнилась за N мин, TP1 не достигнут — вход по рынку
                                 # (на истории: 5 мин — $1109, 15 мин — $1223, 5 мин только в диапазоне — $1199)
  entry_fallback_in_range: false # запасной вход только если цена внутри диапазона
  # Стоп относительно тейков (идея владельца 07.10 «стоп не дальше тейка»). По умолчанию none — стоп как в сигнале.
  # На истории 27.05–02.10 при текущих настройках: none — $1304 (172 сигнала, средний минус $28, худший −$104);
  #   skip_tp1 (не входить, если стоп дальше TP1) — $1040 (25 сигналов); skip_tp2 — $1089 (86); skip_total — $1086 (96);
  #   cap_tp1 (стоп всех позиций не дальше TP1) — $1277 (средний минус $17, худший −$63; ×1.5 — $1178, ×2 — $1235);
  #   cap_each (стоп каждой позиции не дальше её тейка) — $1244; cap_tp2 — $1251.
  # Сигналы с дальним стопом у этого канала — самые надёжные: стоп в 3–5 раз дальше TP1 — 27 из 32 в плюс.
  sl_rule: none                  # none | skip_tp1 | skip_tp2 | skip_total | cap_tp1 | cap_tp2 | cap_each
  # sl_cap_mult: 1.0             # для cap_*: стоп не дальше (расстояние до тейка × множитель)
  pending_expiry_min: 240        # BUY/SELL LIMIT по обычному сигналу ждёт до 4 ч (и снимается при TP1/стопе без нас)
  limit_signal_expiry_min: 10080 # LIMIT-сигнал ждёт, пока канал не отменит или цена не дойдёт до TP1 (максимум 7 дней)
  reduce_window_min: 15          # «большой стоп, занижайте лот» отдельным сообщением — учитываем в течение 15 мин после сигнала

management:
  auto_be_after_tp1: true        # куратор: после TP1 стоп в безубыток (канал «пока не переставляю» — отменяет)
  be_near_tp1_usd: 0             # >0: безубыток раньше — когда цена не дошла до TP1 меньше чем на N $ (выключено).
                                 # На истории (07.10): 0.5 — $1368, 1 — $1356, 2 — $1284 против $1299 без него
  be_at_frac: 0                  # >0: безубыток, когда цена прошла такую долю пути от входа до TP1 (0.8 — $1335, 0.6 — $1232)
  follow_be: true                # выполнять «стоп в БУ» из канала
  follow_close: true             # выполнять «закрываем по рынку»
  follow_closed_reports: true    # канал пишет «сделка закрылась» — закрыть то, что осталось у нас

weekend:
  enabled: false                 # пятничного закрытия у куратора нет; канал сам пишет, если закрываем перед выходными
  no_new_entries_after: "22:00"  # (если enabled) пятница, МСК
  close_all_at: "23:30"          # (если enabled) пятница, МСК — закрыть всё

symbols:
  GOLD:
    enabled: true
    candidates: [XAUUSD, GOLD, XAUUSD., XAUUSDm, XAUUSD.r]
    entry_tolerance: 2.0     # можно входить до +2$ от края зоны (правило куратора)
    max_spread: 0.8          # больше — не входим (новости)
    max_slippage: 0.5        # допустимое проскальзывание при входе, $
    be_offset: 0.3           # безубыток = вход + 0.3$ (чтобы покрыть спред/комиссию)
    min_sl_gap: 1.0          # не входить, если до стопа меньше 1$
  BTC:
    enabled: true            # 07.10 владелец: «чтобы всё чётко работало по сигналам битка»
    candidates: [BITCOIN, BTCUSD]   # у FxPro — BITCOIN (1 лот = 1 BTC)
    risk_pct: 4              # лот от риска: при стопе теряем 4% баланса (таблица куратора — для золота, к BTC не подходит)
    weekend_trading: true    # биткоин торгуется и в выходные (сигналы канала по BTC почти все в субботу/воскресенье)
    entry_tolerance: 50
    max_spread: 60
    max_slippage: 30
    be_offset: 20
    min_sl_gap: 50
    # Брокер (FxPro BITCOIN) не принимает стоп/тейк/лимитку ближе $200 к цене (trade_stops_level 20000),
    # а TP1 в сигналах бывает в $100. Такие уровни копировщик держит сам (trader._fit / virtual_tick):
    # тейк — закрывает по рынку, БУ — закрывает при возврате цены, лимитка — входит по рынку при касании.
    # У брокера всегда остаётся стоп (при близком стопе — страховочный, на $240 дальше).

# Проверки сигналов на опечатки
sanity:
  max_zone_pct: 0.75         # зона входа шире 0.75% цены — опечатка
  max_tp_pct: 3.0            # тейк дальше 3% от входа — опечатка
  max_sl_pct: 2.0            # стоп дальше 2% от входа — опечатка

monitor_interval_sec: 0.5

reports:
  enabled: true
  daily_at: "23:50"          # Пн–Пт, МСК
  weekly_at: "23:52"         # пятница, МСК
  monthly_at: "10:00"        # 1-е число — итоги прошлого месяца

# Второй слой защиты (guard.py): опасная сделка не исполняется — пауза и кнопки в группе
# «✅ Открыть как есть / ⚖️ С безопасным лотом / ❌ Пропустить».
# Пороги откалиброваны по истории канала: обычный риск сделки 4–8% баланса, стоп ~$17.
guard:
  enabled: true
  max_trade_risk_pct: 10        # потеря при стопе > 10% баланса
  max_total_risk_pct: 15        # вместе с уже открытыми сделками > 15%
  max_sl_distance: {GOLD: 80, BTC: 3000}   # стоп необычно далеко от входа
  max_lot_vs_table: 2           # лот больше табличного в 2+ раза
  max_total_lot: 0.5            # абсолютный потолок лота на сигнал
  max_margin_pct_free: 50       # маржа > 50% свободных средств
  max_signals_per_30min: 4      # шквал сигналов
  max_losses_in_row: 3          # 3 убытка подряд → пауза и вопрос
  max_drawdown_pct: 25          # эквити ниже пика баланса на 25% → пауза и вопрос
  approval_ttl_min: 15          # разрешение на сделку действует 15 минут
